[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "trailhead-support-api"
version = "0.1.0"
description = "Grounded customer-support API powered by Anthropic Claude"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
dependencies = [
  "anthropic>=0.75.0,<1.0",
  "fastapi>=0.115.0,<1.0",
  "pydantic>=2.10.0,<3.0",
  "python-dotenv>=1.0.0,<2.0",
  "uvicorn[standard]>=0.34.0,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0,<1.0",
  "pytest>=8.3.0,<10.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
